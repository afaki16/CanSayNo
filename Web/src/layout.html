<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#5B4BE0">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://cansayno.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{url}}">
  <meta property="og:url" content="{{url}}">
  <link rel="alternate" hreflang="{{lang}}" href="{{url}}">
  <link rel="alternate" hreflang="{{ui.altLang}}" href="{{altUrl}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="{{bodyClass}}">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="{{ui.home}}" aria-label="{{ui.homeLabel}}">
        <img class="brand-mark" src="/assets/logo.svg" alt="" width="30" height="30">
        <span class="brand-name">CanSayNo</span>
      </a>
      <div class="header-right">
        <nav class="header-nav" aria-label="{{ui.navLabel}}">
          <a href="{{ui.home}}#{{ui.howId}}">{{ui.navHow}}</a>
          <a href="{{ui.home}}#{{ui.contextsId}}">{{ui.navContexts}}</a>
          <a href="{{ui.home}}#{{ui.priceId}}">{{ui.navPrice}}</a>
        </nav>
        <a class="lang-switch" href="{{altPath}}" hreflang="{{ui.altLang}}" lang="{{ui.altLang}}">{{ui.altLabel}}</a>
      </div>
    </div>
  </header>

{{content}}

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <a class="brand" href="{{ui.home}}">
          <img class="brand-mark" src="/assets/logo.svg" alt="" width="30" height="30">
          <span class="brand-name">CanSayNo</span>
        </a>
        <p>{{ui.tagline}}</p>
        <p><a href="mailto:info@factech.app">info@factech.app</a></p>
      </div>
      <nav aria-label="{{ui.legal}}">
        <h2>{{ui.legal}}</h2>
        <a href="{{ui.privacyHref}}">{{ui.privacy}}</a>
        <a href="{{ui.termsHref}}">{{ui.terms}}</a>
        <a href="{{ui.deletionHref}}">{{ui.deletion}}</a>
      </nav>
      <nav aria-label="{{ui.languageLabel}}">
        <h2>{{ui.languageLabel}}</h2>
        <a href="/" lang="tr" hreflang="tr">Türkçe</a>
        <a href="/en/" lang="en" hreflang="en">English</a>
      </nav>
    </div>
    <div class="container footer-note">
      <p>{{ui.disclaimer}} © 2026 CanSayNo</p>
    </div>
  </footer>
</body>
</html>
